# Detras de ngrok la peticion llega por http pero el cliente uso https: se respeta lo
# que diga el proxy de fuera y, si no hay ninguno, el esquema propio.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El limite real de subida lo impone MAX_UPLOAD_MB en el backend; nginx solo tiene
    # que dejar pasar. Su valor por defecto (1 MB) rechazaria los PDF con un 413.
    client_max_body_size 25m;

    # Mismo origen que la SPA, igual que el proxy de ng serve: no hay CORS que resolver.
    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host conserva el puerto: el backend arma con el las URL de los QR.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        # Una consulta institucional puede tardar ~20 s (reranker en CPU).
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # Rutas de Angular: lo que no sea un archivo real cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
