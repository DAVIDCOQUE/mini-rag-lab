name: mini-rag-lab

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_rag_lab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mini_rag_lab}"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"   # panel web en http://localhost:6333/dashboard

  backend:
    build: ./backend
    environment:
      # Dentro del contenedor, 127.0.0.1 solo es alcanzable desde el propio contenedor.
      HOST: 0.0.0.0
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-mini_rag_lab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      QDRANT_HOST: qdrant
      # Ollama corre en el host, no aqui: cada maquina ya tiene sus modelos descargados
      # y no tiene sentido duplicar varios GB dentro de un volumen.
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:?define LLM_MODEL en el .env de la raiz}
    volumes:
      - uploads:/app/storage
    extra_hosts:
      # Necesario en Linux para resolver host.docker.internal; inofensivo en Windows y Mac.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # El arranque carga el reranker y calienta el router antes de responder.
      start_period: 90s

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
  qdrant_storage:
  uploads:
